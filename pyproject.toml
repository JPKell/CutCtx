[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cutctx"
description = "Deterministic transcript compaction: plan which turns to keep, mask, summarize or drop against a token budget, then apply the plan. Pure, no model, no I/O."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # The only runtime dependency, and the only one permitted: gold standards §1.1 gives CutCtx a
    # non-suite dependency budget of 0, and ADR-0052 decision 2 makes that budget the mechanism —
    # with no HTTP client and no provider in the graph, the "second path to a model" is absent by
    # construction rather than by policy. `SuiteError`, `ValidationError`, `canonical_json` and
    # `sha256_of` are the whole of what is used, and all four ship in 0.4.0; the arc pins 0.4.1 as
    # its single baseline (development plan, "Sequence position").
    "baseaicore>=0.4.1,<0.5",
]

[project.optional-dependencies]
dev = [
    # >=9.0.3 excludes PYSEC-2026-1845 (vulnerable /tmp/pytest-of-{user} handling, affecting
    # pytest through 9.0.2). Matches the pin every sibling repository already moved to.
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    # New to the suite's toolchain with this repository. CutCtx's invariants are stated over
    # *arbitrary* transcripts, so they are tested that way (spec §18, development plan Phase 1).
    # A development dependency only: it never enters the runtime budget above.
    "hypothesis>=6.100,<7",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/JPKell/CutCtx"
Documentation = "https://github.com/JPKell/CutCtx/tree/main/docs"
Changelog = "https://github.com/JPKell/CutCtx/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/cutctx/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cutctx"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]
# The acceptance script is a standalone check an operator runs in a clean virtualenv and
# reads the output of, so printing is its whole interface. It is not imported by the
# package and not part of the wheel; `T201` is the rule for library code, which this is not.
"acceptance/**" = ["T201"]
# `docs/quickstart.py` is the ten-line runnable example `docs/quickstart.md` publishes the
# output of: printing is what it is for. Everything else under `docs/` is mirrored markdown,
# which ruff does not read.
"docs/*.py" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
# The importable name, not the source path: CI installs the built distribution rather than an
# editable checkout (Packaging Standards §4), so coverage must find the package wherever it is
# installed. `paths` folds the two locations into one name in the report.
source = ["cutctx"]
branch = true

[tool.coverage.paths]
source = ["src/cutctx", "*/site-packages/cutctx"]

[tool.coverage.report]
# Shared packages carry a 95% floor, not the 85% applications use.
fail_under = 95
show_missing = true
